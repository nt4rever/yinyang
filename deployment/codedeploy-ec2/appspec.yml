# ==============================================
# AppSpec for EC2 deployment
# ==============================================
version: 0.0
os: linux
files:
  - source: .
    destination: /usr/share/nginx/html
file_exists_behavior: OVERWRITE
permissions:
  - object: /usr/share/nginx/html
    owner: nginx
    group: nginx
    mode: 644
    type:
      - file
  - object: /usr/share/nginx/html
    owner: nginx
    group: nginx
    mode: 755
    type:
      - directory
hooks:
  ApplicationStop:
    - location: deployment/codedeploy-ec2/hooks/stop-services.sh
      timeout: 60
      runas: ec2-user
  AfterInstall:
    - location: deployment/codedeploy-ec2/hooks/env-generate.sh
      timeout: 60
      runas: ec2-user
    - location: deployment/codedeploy-ec2/hooks/cache-generate.sh
      timeout: 60
      runas: ec2-user
    - location: deployment/codedeploy-ec2/hooks/nginx-restart.sh
      timeout: 60
      runas: ec2-user
    - location: deployment/codedeploy-ec2/hooks/php-fpm-restart.sh
      timeout: 60
      runas: ec2-user
    - location: deployment/codedeploy-ec2/hooks/supervisord-restart.sh
      timeout: 60
      runas: ec2-user
